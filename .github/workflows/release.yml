name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Extract Changelog Section
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## /{/^## /d;p}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download ISO
        uses: actions/download-artifact@v8.0.1
        with:
          name: eszos-iso
          path: bin/

      - name: Rename ISO
        run: mv bin/eszos.iso "bin/eszos-${{ github.ref_name }}.iso"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ESZ-OS ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---
            [CHANGELOG.md](https://github.com/JonasPaprotka/ESZ-OS/blob/${{ github.sha }}/CHANGELOG.md)
          files: bin/eszos-${{ github.ref_name }}.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}