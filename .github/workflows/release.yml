name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify Kernel Version Matches Tag
        run: |
          read_define() {
            grep -m1 "^#define $1[[:space:]]" kernel/config.h | awk '{print $3}'
          }
          MAJOR=$(read_define OS_VERSION_MAJOR)
          MINOR=$(read_define OS_VERSION_MINOR)
          PATCH=$(read_define OS_VERSION_PATCH)
          KERNEL_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG%%-*}"

          if [ "$KERNEL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag is $TAG_VERSION but kernel/config.h says $KERNEL_VERSION"
            exit 1
          fi
          echo "kernel/config.h and tag agree on $KERNEL_VERSION"

      - name: Extract Changelog Section
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES=$(sed -n "/^## ${VERSION}$/,/^## /{/^## /d;p}" CHANGELOG.md)

          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no content under '## ${VERSION}'"
            exit 1
          fi

          echo "notes<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

  build:
    needs: guards
    uses: ./.github/workflows/build.yml

  tests:
    needs: guards
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [guards, build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v8.0.1
        with:
          name: eszos-iso
          path: bin/

      - name: Rename ISO and Write Checksum
        run: |
          cd bin
          mv eszos.iso "eszos-${{ github.ref_name }}.iso"
          sha256sum "eszos-${{ github.ref_name }}.iso" > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ESZ-OS ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ${{ needs.guards.outputs.notes }}

            ---
            [CHANGELOG.md](https://github.com/JonasPaprotka/ESZ-OS/blob/${{ github.ref_name }}/CHANGELOG.md)
          files: |
            bin/eszos-${{ github.ref_name }}.iso
            bin/SHA256SUMS
