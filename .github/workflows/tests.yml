name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache doctest
        uses: actions/cache@v6.1.0
        with:
          path: tests/vendor
          key: ${{ runner.os }}-doctest-${{ hashFiles('versions.env') }}

      - name: Run Tests
        run: make -C tests